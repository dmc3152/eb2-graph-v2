extend type Query {
  callings(input: CallingSearch): CallingConnection
}

type Calling {
  id: ID!
  name: String!
  assignedTo: [User!]!
  permissions: [Permission!]!
}

input CallingSearch {
  paging: OffsetPaging
  filters: CallingFilters
}

input CallingFilters {
  nameContains: String
  isAssigned: Boolean
}

type CallingConnection {
  edges: [CallingEdge!]!
  pageInfo: PageInfo!
}

type CallingEdge {
  node: Calling!
}